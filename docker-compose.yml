# ContentFlow — local development stack
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contentflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/contentflow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/contentflow?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:4000
      CLIENT_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost
      ENABLE_IN_PROCESS_SCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  worker:
    build:
      context: ./backend
      target: worker
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/contentflow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/contentflow?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_IN_PROCESS_SCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
